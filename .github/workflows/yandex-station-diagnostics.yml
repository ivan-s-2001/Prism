name: Yandex Station diagnostics

on:
  push:
    branches: [feature/yandex-station-connect]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yandex-station-${{ github.ref }}
  cancel-in-progress: true

jobs:
  voice-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Voice commands and Connect session regressions
        working-directory: voice-bridge
        run: python -m unittest discover -v
  transport-jvm:
    # These are the real production HTTP/WAV/health classes, not mocks.
    # Run independently of Android SDK availability.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run transport regression tests without Android SDK
        shell: bash
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          if ! command -v kotlinc >/dev/null; then
            curl --fail --location --retry 3 https://github.com/JetBrains/kotlin/releases/download/v2.1.21/kotlin-compiler-2.1.21.zip -o "$WORK/kotlin.zip"
            unzip -q "$WORK/kotlin.zip" -d "$WORK"
            export PATH="$WORK/kotlinc/bin:$PATH"
          fi
          curl --fail --location --retry 3 https://repo.maven.apache.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar -o "$WORK/junit.jar"
          curl --fail --location --retry 3 https://repo.maven.apache.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar -o "$WORK/hamcrest.jar"
          MAIN=app/src/main/java/com/prism/music/connect
          TEST=app/src/test/java/com/prism/music/connect/yandex
          CP="$WORK/junit.jar:$WORK/hamcrest.jar"
          kotlinc -jvm-target 17 -classpath "$CP" -include-runtime -d "$WORK/tests.jar" \
            "$MAIN/CastBodies.kt" "$MAIN/HttpServer.kt" "$MAIN/MediaServer.kt" "$MAIN/Upnp.kt" \
            "$MAIN/yandex/StationLinkHealth.kt" "$MAIN/yandex/LivePacer.kt" "$MAIN/yandex/LivePcmReplay.kt" \
            "$TEST/StationWavSliceTest.kt" "$TEST/StationMediaSessionTest.kt" "$TEST/StationLinkHealthTest.kt" \
            "$TEST/LivePacerTest.kt" "$TEST/LivePcmReplayTest.kt" \
            app/src/main/java/com/prism/music/data/foryou/VibeLearning.kt \
            app/src/main/java/com/prism/music/data/foryou/VibeGraph.kt \
            app/src/test/java/com/prism/music/data/foryou/VibeLearningTest.kt \
            app/src/test/java/com/prism/music/data/foryou/VibeGraphTest.kt
          java -cp "$WORK/tests.jar:$CP" org.junit.runner.JUnitCore \
            com.prism.music.connect.yandex.StationWavSliceTest \
            com.prism.music.connect.yandex.StationMediaSessionTest \
            com.prism.music.connect.yandex.StationLinkHealthTest \
            com.prism.music.connect.yandex.LivePacerTest \
            com.prism.music.connect.yandex.LivePcmReplayTest \
            com.prism.music.data.foryou.VibeLearningTest \
            com.prism.music.data.foryou.VibeGraphTest
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android platform using runner SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          if [ ! -f "$ANDROID_HOME/platforms/android-37/android.jar" ]; then
            "$SDKMANAGER" --channel=3 --list || true
            "$SDKMANAGER" --channel=3 --install "platforms;android-37"
          fi
          test -f "$ANDROID_HOME/platforms/android-37/android.jar"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run protocol tests and assemble side-by-side APK
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --tests 'com.prism.music.connect.yandex.*' --tests 'com.prism.music.MyWaveTest' --tests 'com.prism.music.RecFeedbackTest' --tests 'com.prism.music.PlaybackSourceUxTest' --tests 'com.prism.music.QueueResumeTest' --tests 'com.prism.music.PlayerReactionsTest' --tests 'com.prism.music.Vibe*Test' --tests 'com.prism.music.playback.SavedQueueTextTest' --tests 'com.prism.music.data.foryou.VibeLearningTest' --tests 'com.prism.music.data.foryou.VibeGraphTest' :app:assembleDebug -PsideBySide=station -PsideByLabel="Prism Station Lab" --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: prism-station-lab
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: station-test-results
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
