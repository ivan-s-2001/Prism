name: Yandex Station diagnostics

on:
  push:
    branches: [feature/yandex-station-connect]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yandex-station-${{ github.ref }}
  cancel-in-progress: true

jobs:
  voice-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Voice commands and Connect session regressions
        working-directory: voice-bridge
        run: python -m unittest discover -v
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android platform using runner SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-37"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run protocol tests and assemble side-by-side APK
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --tests 'com.prism.music.connect.yandex.*' :app:assembleDebug -PsideBySide=station -PsideByLabel="Prism Station Lab" --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: prism-station-lab
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: station-test-results
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
