name: Prism Original APK
on:
  push:
    branches: [feat/uncensored-versions]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prism-original-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-37'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build installable APK alongside official Prism
        run: bash gradlew :app:assembleRelease -PsideBySide=original -PsideByLabel="Prism Original" -PdebugSign --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Prism-Original-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Check uncensored matcher
        run: bash gradlew :app:testDebugUnitTest --tests '*UncensoredRulesTest*' --stacktrace
